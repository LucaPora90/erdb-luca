name: Sync Fork & Rebuild Spaces

on:
  schedule:
    - cron: '0 * * * *'  # ogni ora
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # forza Node 24 per tutte le action

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Sync erdb-luca fork
      run: |
        git clone https://github.com/LucaPora90/erdb-luca.git erdb-luca
        cd erdb-luca
        git remote add upstream https://github.com/realbestia1/erdb.git || true
        git fetch upstream
        git merge upstream/main
        git push origin main

    - name: Sync EasyProxy fork
      run: |
        git clone https://github.com/LucaPora90/EasyProxy.git EasyProxy
        cd EasyProxy
        git remote add upstream https://github.com/realbestia1/EasyProxy.git || true
        git fetch upstream
        git merge upstream/main
        git push origin main

    - name: Trigger Space factory rebuilds
      uses: huggingface/spaces-action@v0.2.0  # assicurati che sia la versione corretta
      with:
        space_ids: |
          LucaPora90/erdb-luca
          LucaPora90/EasyProxy
        rebuild: true
