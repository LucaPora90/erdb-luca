name: Sync Forks & Factory Rebuild Spaces

on:
  schedule:
    - cron: '0 * * * *'  # ogni ora
  workflow_dispatch:

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # Sync erdb-luca
      - name: Checkout erdb-luca
        uses: actions/checkout@v4
        with:
          repository: LucaPora90/erdb-luca
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Add upstream remote for erdb-luca
        run: git remote add upstream https://github.com/realbestia1/erdb.git

      - name: Fetch upstream erdb-luca
        run: git fetch upstream main

      - name: Merge upstream erdb-luca and detect changes
        id: erdb-merge
        run: |
          git checkout main
          git merge upstream/main --no-edit || echo "No changes"
          if [ "$(git log -1 --pretty=%H --not origin/main)" ]; then
            echo "updated=true" >> $GITHUB_ENV
          else
            echo "updated=false" >> $GITHUB_ENV
          fi

      - name: Push erdb-luca if updated
        if: env.updated == 'true'
        run: git push origin main

      # Sync EasyProxy
      - name: Checkout EasyProxy
        uses: actions/checkout@v4
        with:
          repository: LucaPora90/EasyProxy
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          path: EasyProxy

      - name: Add upstream remote EasyProxy
        run: git remote add upstream https://github.com/realbestia1/EasyProxy.git
        working-directory: EasyProxy

      - name: Fetch upstream EasyProxy
        run: git fetch upstream main
        working-directory: EasyProxy

      - name: Merge upstream EasyProxy and detect changes
        id: easyproxy-merge
        run: |
          git checkout main
          git merge upstream/main --no-edit || echo "No changes"
          if [ "$(git log -1 --pretty=%H --not origin/main)" ]; then
            echo "easy_updated=true" >> $GITHUB_ENV
          else
            echo "easy_updated=false" >> $GITHUB_ENV
          fi
        working-directory: EasyProxy

      - name: Push EasyProxy if updated
        if: env.easy_updated == 'true'
        run: git push origin main
        working-directory: EasyProxy

      # Factory rebuild Spaces
      - name: Rebuild erdb-luca Space
        if: env.updated == 'true'
        run: |
          echo "Triggering factory rebuild for erdb-luca Space..."
          huggingface-cli login --token ${{ secrets.HF_TOKEN }}
          huggingface-cli space build LucaPora90/erdb-luca --yes

      - name: Rebuild EasyProxy Space
        if: env.easy_updated == 'true'
        run: |
          echo "Triggering factory rebuild for EasyProxy Space..."
          huggingface-cli login --token ${{ secrets.HF_TOKEN }}
          huggingface-cli space build LucaPora90/EasyProxy --yes
