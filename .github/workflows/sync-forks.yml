name: Sync forks automatically + conditional HF rebuild

on:
  schedule:
    - cron: "0 2 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - repo: LucaPora90/EasyProxy
            branch: main
          - repo: LucaPora90/erdb-luca
            branch: main

    outputs:
      updated: ${{ steps.check_update.outputs.updated }}

    steps:
      - name: Sync fork
        id: check_update
        run: |
          echo "Syncing ${{ matrix.repo }}"
          
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.FORK_SYNC_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ matrix.repo }}/merge-upstream \
            -d "{\"branch\":\"${{ matrix.branch }}\"}")

          echo "HTTP status: $response"

          if [ "$response" -eq 409 ]; then
            echo "Already up to date"
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$response" -ne 200 ]; then
            echo "Sync failed for ${{ matrix.repo }}"
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "Repo updated!"
          echo "updated=true" >> $GITHUB_OUTPUT

  rebuild-spaces:
    needs: sync
    runs-on: ubuntu-latest
    if: needs.sync.outputs.updated == 'true'  # parte solo se ci sono aggiornamenti

    steps:
      - name: Rebuild HuggingFace Space (Erdbluca)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Rebuilding Erdbluca"
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              https://huggingface.co/api/spaces/wrangler90/Erdbluca/restart)
            echo "HTTP status: $response"
            if [ "$response" -eq 200 ]; then
              echo "Erdbluca rebuilt successfully"
              break
            fi
            echo "Retrying in 10s..."
            sleep 10
          done

      - name: Rebuild HuggingFace Space (EasyProxy)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Rebuilding EasyProxy"
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              https://huggingface.co/api/spaces/wrangler90/EasyProxy/restart)
            echo "HTTP status: $response"
            if [ "$response" -eq 200 ]; then
              echo "EasyProxy rebuilt successfully"
              break
            fi
            echo "Retrying in 10s..."
            sleep 10
          done
