name: Ultra-Light Sync & Factory Rebuild

on:
  workflow_dispatch: # esecuzione manuale
  schedule:
    - cron: '0 2 * * *' # ogni giorno alle 2:00 AM

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Aggiorna erdb-luca
      - name: Checkout erdb-luca
        uses: actions/checkout@v4
        with:
          repository: LucaPora90/erdb-luca
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync erdb-luca with upstream
        run: |
          git remote add upstream https://github.com/realbestia1/erdb.git || true
          git fetch upstream
          git reset --hard upstream/main
          git push origin HEAD:main --force

      # 2️⃣ Aggiorna EasyProxy
      - name: Checkout EasyProxy
        uses: actions/checkout@v4
        with:
          repository: LucaPora90/EasyProxy
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync EasyProxy with upstream
        run: |
          git remote add upstream https://github.com/realbestia1/EasyProxy.git || true
          git fetch upstream
          git reset --hard upstream/main
          git push origin HEAD:main --force

      # 3️⃣ Trigger factory rebuild erdb-luca Space
      - name: Factory rebuild erdb-luca Space
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: "LucaPora90",
              repo: "erdb-luca",
              workflow_id: "factory-rebuild.yml",
              ref: "main"
            })

      # 4️⃣ Trigger factory rebuild EasyProxy Space
      - name: Factory rebuild EasyProxy Space
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: "LucaPora90",
              repo: "EasyProxy",
              workflow_id: "factory-rebuild.yml",
              ref: "main"
            })
