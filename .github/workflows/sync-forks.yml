name: Sync Forks & Factory Rebuild Spaces

on:
  schedule:
    - cron: '0 * * * *'  # ogni ora
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout erdb-luca
        uses: actions/checkout@v4
        with:
          repository: LucaPora90/erdb-luca
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch upstream erdb-luca
        run: |
          git remote add upstream https://github.com/realbestia1/erdb.git || true
          git fetch upstream

      - name: Check erdb-luca updates
        id: erdb_update
        run: |
          UPSTREAM=$(git rev-parse upstream/main)
          LOCAL=$(git rev-parse HEAD)
          echo "upstream=$UPSTREAM" >> $GITHUB_OUTPUT
          echo "local=$LOCAL" >> $GITHUB_OUTPUT
          [[ "$UPSTREAM" != "$LOCAL" ]] && echo "updated=true" >> $GITHUB_OUTPUT || echo "updated=false" >> $GITHUB_OUTPUT

      - name: Sync erdb-luca fork
        if: steps.erdb_update.outputs.updated == 'true'
        run: |
          git merge upstream/main --allow-unrelated-histories -m "Sync upstream" || true
          git push origin main

      - name: Trigger erdb-luca Space factory rebuild
        if: steps.erdb_update.outputs.updated == 'true'
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/LucaPora90/erdb-luca/restart?factory=true" \
            -H "Authorization: Bearer $HF_TOKEN"

      - name: Checkout EasyProxy
        uses: actions/checkout@v4
        with:
          repository: LucaPora90/EasyProxy
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch upstream EasyProxy
        run: |
          git remote add upstream https://github.com/realbestia1/EasyProxy.git || true
          git fetch upstream

      - name: Check EasyProxy updates
        id: easy_update
        run: |
          UPSTREAM=$(git rev-parse upstream/main)
          LOCAL=$(git rev-parse HEAD)
          echo "upstream=$UPSTREAM" >> $GITHUB_OUTPUT
          echo "local=$LOCAL" >> $GITHUB_OUTPUT
          [[ "$UPSTREAM" != "$LOCAL" ]] && echo "updated=true" >> $GITHUB_OUTPUT || echo "updated=false" >> $GITHUB_OUTPUT

      - name: Sync EasyProxy fork
        if: steps.easy_update.outputs.updated == 'true'
        run: |
          git merge upstream/main --allow-unrelated-histories -m "Sync upstream" || true
          git push origin main

      - name: Trigger EasyProxy Space factory rebuild
        if: steps.easy_update.outputs.updated == 'true'
        run: |
          curl -s -X POST "https://huggingface.co/api/spaces/LucaPora90/EasyProxy/restart?factory=true" \
            -H "Authorization: Bearer $HF_TOKEN"
