name: Sync & Factory Rebuild

on:
  schedule:
    - cron: '0 * * * *'   # ogni ora
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout erdb-luca fork
        id: sync-erdb
        uses: actions/checkout@v4
        with:
          repository: LucaPora90/erdb-luca
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Pull upstream erdb
        run: |
          git remote add upstream https://github.com/realbestia1/erdb.git
          git fetch upstream
          git merge upstream/main
          git push origin main
        continue-on-error: true

      - name: Checkout EasyProxy fork
        id: sync-easyproxy
        uses: actions/checkout@v4
        with:
          repository: LucaPora90/EasyProxy
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Pull upstream EasyProxy
        run: |
          git remote add upstream https://github.com/realbestia1/EasyProxy.git
          git fetch upstream
          git merge upstream/main
          git push origin main
        continue-on-error: true

      - name: Factory rebuild of Spaces
        if: ${{ steps.sync-erdb.outcome == 'success' || steps.sync-easyproxy.outcome == 'success' }}
        run: |
          echo "Factory rebuild degli Space in corso..."
          python3 -m pip install --upgrade huggingface_hub

          # Login Hugging Face
          echo $HF_TOKEN | python3 -m huggingface_hub login --token

          # Rebuild Space erdb-luca
          python3 -m huggingface_hub api repos-update --repo_id LucaPora90/erdb-luca-space --space

          # Rebuild Space EasyProxy
          python3 -m huggingface_hub api repos-update --repo_id LucaPora90/EasyProxy-space --space

          echo "Factory rebuild completato."
