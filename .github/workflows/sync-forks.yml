name: Sync Fork & Rebuild Spaces

on:
  schedule:
    - cron: '0 * * * *'   # ogni ora
  workflow_dispatch:       # possibilità di trigger manuale

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest
    env:
      FORK_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      HF_API_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Sync erdb-luca fork
        run: |
          git remote add upstream https://github.com/LucaPora90/erdb-luca.git || true
          git fetch upstream
          git checkout main
          git merge upstream/main || echo "No updates"
          git push origin main || echo "Nothing to push"

      - name: Sync EasyProxy fork
        run: |
          git remote add upstream https://github.com/LucaPora90/EasyProxy.git || true
          git fetch upstream
          git checkout main
          git merge upstream/main || echo "No updates"
          git push origin main || echo "Nothing to push"

      - name: Trigger HF Spaces rebuild if updates
        if: steps.sync-erdb-luca.outputs.updated == 'true' || steps.sync-easyproxy.outputs.updated == 'true'
        run: |
          echo "Triggering factory rebuild on Hugging Face Spaces..."
          # Comando ufficiale HF CLI per rebuild
          hf space rebuild --name LucaPora90/erdb-luca
          hf space rebuild --name LucaPora90/EasyProxy
