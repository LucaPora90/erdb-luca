name: Sync forks automatically + conditional HF factory rebuild

on:
  schedule:
    - cron: "0 * * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

concurrency:
  group: sync-and-rebuild
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    outputs:
      updated: ${{ steps.check.outputs.updated }}

    steps:
      - name: Sync forks
        id: check
        run: |
          set -euo pipefail
          updated=false

          sync_repo () {
            repo=$1

            for i in 1 2 3; do
              echo "----------------------------------------"
              echo "[$(date)] Attempt $i: Syncing $repo"

              response_body=$(mktemp)
              response=$(curl -s --max-time 30 -o "$response_body" -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer ${{ secrets.FORK_SYNC_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/$repo/merge-upstream \
                -d "{\"branch\":\"main\"}")

              echo "HTTP status: $response"

              if [ "$response" -eq 200 ]; then
                echo "✅ Repo updated: $repo"
                updated=true
                return
              elif [ "$response" -eq 409 ]; then
                echo "ℹ️ Already up to date: $repo"
                return
              fi

              if [ "$i" -eq 3 ]; then
                echo "❌ Sync failed for $repo"
                cat "$response_body"
                exit 1
              fi

              echo "Retrying in 10s..."
              sleep 10
            done
          }

          sync_repo "LucaPora90/EasyProxy"
          sync_repo "LucaPora90/erdb-luca"

          echo "----------------------------------------"
          echo "FINAL RESULT: updated=$updated"

          echo "updated=$updated" >> $GITHUB_OUTPUT

  rebuild-spaces:
    needs: sync
    runs-on: ubuntu-latest
    if: needs.sync.outputs.updated == 'true'

    steps:
      - name: Factory rebuild HuggingFace Space (Erdbluca)
        run: |
          set -euo pipefail

          for i in 1 2 3; do
            echo "----------------------------------------"
            echo "[$(date)] Attempt $i: Factory rebuilding Erdbluca"

            response_body=$(mktemp)
            response=$(curl -s --max-time 30 -o "$response_body" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              "https://huggingface.co/api/spaces/wrangler90/Erdbluca/restart?factory=true")

            echo "HTTP status: $response"

            if [ "$response" -eq 200 ]; then
              echo "✅ Erdbluca factory rebuild successful"
              break
            fi

            if [ "$i" -eq 3 ]; then
              echo "❌ Erdbluca factory rebuild failed"
              cat "$response_body"
              exit 1
            fi

            sleep 10
          done

      - name: Factory rebuild HuggingFace Space (EasyProxy)
        run: |
          set -euo pipefail

          for i in 1 2 3; do
            echo "----------------------------------------"
            echo "[$(date)] Attempt $i: Factory rebuilding EasyProxy"

            response_body=$(mktemp)
            response=$(curl -s --max-time 30 -o "$response_body" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              "https://huggingface.co/api/spaces/wrangler90/EasyProxy/restart?factory=true")

            echo "HTTP status: $response"

            if [ "$response" -eq 200 ]; then
              echo "✅ EasyProxy factory rebuild successful"
              break
            fi

            if [ "$i" -eq 3 ]; then
              echo "❌ EasyProxy factory rebuild failed"
              cat "$response_body"
              exit 1
            fi

            sleep 10
          done
