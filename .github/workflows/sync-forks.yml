name: Sync forks automatically

on:
  schedule:
    - cron: "0 2 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - repo: LucaPora90/EasyProxy
            branch: main
          - repo: LucaPora90/erdb-luca
            branch: main

    steps:
      - name: Sync fork
        run: |
          echo "Syncing ${{ matrix.repo }}"
          
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.FORK_SYNC_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ matrix.repo }}/merge-upstream \
            -d "{\"branch\":\"${{ matrix.branch }}\"}")

          echo "HTTP status: $response"

          if [ "$response" -eq 409 ]; then
            echo "Already up to date"
            exit 0
          fi

          if [ "$response" -ne 200 ]; then
            echo "Sync failed for ${{ matrix.repo }}"
            exit 1
          fi

  rebuild-spaces:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger HuggingFace Space rebuild (Erdbluca)
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
          https://huggingface.co/api/spaces/wrangler90/Erdbluca/restart

      - name: Trigger HuggingFace Space rebuild (EasyProxy)
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
          https://huggingface.co/api/spaces/wrangler90/EasyProxy/restart
