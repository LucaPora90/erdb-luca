name: Sync Forks & Factory Rebuild Spaces

on:
  schedule:
    - cron: '0 * * * *'  # Ogni ora
  workflow_dispatch:      # Trigger manuale possibile

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HF_TOKEN: ${{ secrets.HF_TOKEN }}  # Hugging Face token per rebuild

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout erdb-luca
        uses: actions/checkout@v4
        with:
          repository: LucaPora90/erdb-luca
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout EasyProxy
        uses: actions/checkout@v4
        with:
          repository: LucaPora90/EasyProxy
          path: EasyProxy
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check for updates erdb-luca
        id: check_erdb
        run: |
          cd erdb-luca
          git fetch origin main
          UPDATES=$(git rev-list HEAD...origin/main --count)
          echo "updates=$UPDATES" >> $GITHUB_OUTPUT

      - name: Check for updates EasyProxy
        id: check_easy
        run: |
          cd EasyProxy
          git fetch origin main
          UPDATES=$(git rev-list HEAD...origin/main --count)
          echo "updates=$UPDATES" >> $GITHUB_OUTPUT

      - name: Factory rebuild erdb-luca Space
        if: steps.check_erdb.outputs.updates != '0'
        run: |
          echo "Updates in erdb-luca detected! Triggering factory rebuild..."
          curl -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/api/spaces/rebuild/LucaPora90/erdb-luca

      - name: Factory rebuild EasyProxy Space
        if: steps.check_easy.outputs.updates != '0'
        run: |
          echo "Updates in EasyProxy detected! Triggering factory rebuild..."
          curl -X POST \
            -H "Authorization: Bearer $HF_TOKEN" \
            https://huggingface.co/api/spaces/rebuild/LucaPora90/EasyProxy
