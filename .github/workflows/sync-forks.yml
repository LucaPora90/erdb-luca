name: Full auto pipeline GHOST (stealth mode)

on:
  schedule:
    - cron: "0 * * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

concurrency:
  group: ghost-pipeline
  cancel-in-progress: true

env:
  IMAGE_NAME: erdb-luca
  REGISTRY: ghcr.io
  OWNER: lucapora90

jobs:
  ghost-control:
    runs-on: ubuntu-latest

    outputs:
      should_build: ${{ steps.fingerprint.outputs.should_build }}
      tag: ${{ steps.fingerprint.outputs.tag }}
      updated_easyproxy: ${{ steps.sync.outputs.updated_easyproxy }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 👀 SYNC SILENZIOSO (SOFT FAIL)
      - name: Silent fork sync
        id: sync
        run: |
          set +e
          updated_easyproxy=false

          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.FORK_SYNC_TOKEN }}" \
            https://api.github.com/repos/LucaPora90/EasyProxy/merge-upstream \
            -d '{"branch":"main"}' | grep -q 200 && updated_easyproxy=true || true

          echo "updated_easyproxy=$updated_easyproxy" >> $GITHUB_OUTPUT

      # 🧠 SMART FINGERPRINT (SOLO FILE CRITICI)
      - name: Fingerprint stealth
        id: fingerprint
        run: |
          set -euo pipefail

          HASH=$(find . \
            -type f \
            \( -name "*.js" -o -name "*.ts" -o -name "package.json" -o -name "package-lock.json" -o -name "Dockerfile" \) \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            -exec sha256sum {} \; | sort | sha256sum | cut -d ' ' -f1)

          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:$HASH"

          echo "Fingerprint: $HASH"

          # 🔍 ANTI-BUILD SE ESISTE
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

          echo "tag=$HASH" >> $GITHUB_OUTPUT

  docker-ghost:
    needs: ghost-control
    if: needs.ghost-control.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx & QEMU
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # ⚡ BUILD MINIMALE + MULTI-ARCH
      - name: Build & Push stealth
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ needs.ghost-control.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

  rebuild-ghost:
    needs: [ghost-control, docker-ghost]
    if: needs.ghost-control.outputs.should_build == 'true' || needs.ghost-control.outputs.updated_easyproxy == 'true'
    runs-on: ubuntu-latest

    steps:
      # 🔁 HF SAFE REBUILD (NON BLOCCA PIPELINE)
      - name: Rebuild EasyProxy stealth
        if: needs.ghost-control.outputs.updated_easyproxy == 'true'
        run: |
          set +e
          curl -s -L -X POST \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            "https://huggingface.co/api/spaces/wrangler90/easyproxy-space/restart?factory=true" || true

      - name: Rebuild Erdbluca stealth
        if: needs.ghost-control.outputs.should_build == 'true'
        run: |
          set +e
          curl -s -L -X POST \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            "https://huggingface.co/api/spaces/wrangler90/erdbluca/restart?factory=true" || true
