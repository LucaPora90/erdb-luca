name: Sync forks automatically + conditional HF factory rebuild

on:
  schedule:
    - cron: "0 * * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

concurrency:
  group: sync-and-rebuild
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    outputs:
      updated_easyproxy: ${{ steps.check.outputs.updated_easyproxy }}
      updated_erdb: ${{ steps.check.outputs.updated_erdb }}

    steps:
      - name: Sync forks
        id: check
        run: |
          set -euo pipefail

          updated_easyproxy=false
          updated_erdb=false

          sync_repo () {
            repo=$1
            key=$2

            for i in 1 2 3; do
              echo "----------------------------------------"
              echo "[$(date)] Attempt $i: Syncing $repo"

              response_body=$(mktemp)
              response=$(curl -s --max-time 30 -o "$response_body" -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer ${{ secrets.FORK_SYNC_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/$repo/merge-upstream \
                -d "{\"branch\":\"main\"}")

              echo "HTTP status: $response"

              if [ "$response" -eq 200 ]; then
                echo "::notice::Repo updated: $repo"
                eval "$key=true"
                rm -f "$response_body"
                return
              elif [ "$response" -eq 409 ]; then
                echo "Already up to date: $repo"
                rm -f "$response_body"
                return
              fi

              if [ "$i" -eq 3 ]; then
                echo "::error::Sync failed for $repo"
                cat "$response_body"
                rm -f "$response_body"
                exit 1
              fi

              sleep 10
            done
          }

          sync_repo "LucaPora90/EasyProxy" updated_easyproxy
          sync_repo "LucaPora90/erdb-luca" updated_erdb

          echo "updated_easyproxy=$updated_easyproxy" >> $GITHUB_OUTPUT
          echo "updated_erdb=$updated_erdb" >> $GITHUB_OUTPUT

  rebuild-spaces:
    needs: sync
    runs-on: ubuntu-latest

    steps:
      - name: Factory rebuild EasyProxy
        if: needs.sync.outputs.updated_easyproxy == 'true'
        run: |
          set -euo pipefail

          for i in 1 2 3; do
            echo "----------------------------------------"
            echo "[$(date)] Rebuilding EasyProxy (attempt $i)"

            response_body=$(mktemp)
            response=$(curl -s --max-time 30 -o "$response_body" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              "https://huggingface.co/api/spaces/wrangler90/EasyProxy/restart?factory=true")

            echo "HTTP status: $response"
            echo "Response:"
            cat "$response_body"

            if [ "$response" -eq 200 ]; then
              echo "::notice::EasyProxy rebuilt"
              rm -f "$response_body"
              break
            fi

            if [ "$i" -eq 3 ]; then
              echo "::error::EasyProxy rebuild failed"
              rm -f "$response_body"
              exit 1
            fi

            rm -f "$response_body"
            sleep 10
          done

      - name: Factory rebuild Erdbluca
        if: needs.sync.outputs.updated_erdb == 'true'
        run: |
          set -euo pipefail

          for i in 1 2 3; do
            echo "----------------------------------------"
            echo "[$(date)] Rebuilding Erdbluca (attempt $i)"

            response_body=$(mktemp)
            response=$(curl -s --max-time 30 -o "$response_body" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              "https://huggingface.co/api/spaces/wrangler90/Erdbluca/restart?factory=true")

            echo "HTTP status: $response"
            echo "Response:"
            cat "$response_body"

            if [ "$response" -eq 200 ]; then
              echo "::notice::Erdbluca rebuilt"
              rm -f "$response_body"
              break
            fi

            if [ "$i" -eq 3 ]; then
              echo "::error::Erdbluca rebuild failed"
              rm -f "$response_body"
              exit 1
            fi

            rm -f "$response_body"
            sleep 10
          done
