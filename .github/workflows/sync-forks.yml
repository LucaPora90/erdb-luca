name: Sync Fork & Rebuild Spaces

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-hf-spaces
  cancel-in-progress: true

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest
    env:
      HF_API_TOKEN: ${{ secrets.HF_TOKEN }}
      FORK_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          fetch-depth: 0

      - name: Cache Node modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Cache Python packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # -----------------------
      # SYNC ERDB
      # -----------------------
      - name: Sync erdb-luca fork
        id: sync-erdb
        run: |
          set -e

          git remote add upstream https://github.com/LucaPora90/erdb-luca.git 2>/dev/null || true
          git fetch upstream

          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/main)

          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "No updates (erdb)"
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            git merge upstream/main --no-edit
            git push origin main
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      # -----------------------
      # SYNC PROXY
      # -----------------------
      - name: Sync EasyProxy fork
        id: sync-proxy
        run: |
          set -e

          git remote add upstream https://github.com/LucaPora90/EasyProxy.git 2>/dev/null || true
          git fetch upstream

          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/main)

          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "No updates (proxy)"
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            git merge upstream/main --no-edit
            git push origin main
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      # -----------------------
      # DEPLOY ERDB SPACE
      # -----------------------
      - name: Deploy erdb Space
        if: steps.sync-erdb.outputs.updated == 'true'
        run: |
          set -e

          echo "Deploying erdb Space..."

          rm -rf erdb-space
          git clone https://user:${HF_API_TOKEN}@huggingface.co/spaces/LucaPora90/erdb-luca erdb-space

          rsync -a --delete --exclude ".git" ./ erdb-space/

          date -u +"%Y-%m-%dT%H:%M:%SZ" > erdb-space/build_info.txt

          cd erdb-space
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A
          git commit -m "Auto sync erdb $(date +%s)" || echo "No changes"
          git push

      # -----------------------
      # DEPLOY PROXY SPACE
      # -----------------------
      - name: Deploy EasyProxy Space
        if: steps.sync-proxy.outputs.updated == 'true'
        run: |
          set -e

          echo "Deploying EasyProxy Space..."

          rm -rf proxy-space
          git clone https://user:${HF_API_TOKEN}@huggingface.co/spaces/LucaPora90/EasyProxy proxy-space

          rsync -a --delete --exclude ".git" ./ proxy-space/

          date -u +"%Y-%m-%dT%H:%M:%SZ" > proxy-space/build_info.txt

          cd proxy-space
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A
          git commit -m "Auto sync proxy $(date +%s)" || echo "No changes"
          git push
