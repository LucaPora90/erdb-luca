name: Sync Fork & Rebuild Spaces

on:
  schedule:
    - cron: '0 * * * *'  # ogni ora
  workflow_dispatch:  # permette di eseguire manualmente

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/realbestia1/erdb.git || true
          git fetch upstream
          
      - name: Check for updates
        id: check_update
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          LOCAL_SHA=$(git rev-parse HEAD)
          echo "upstream=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "local=$LOCAL_SHA" >> $GITHUB_OUTPUT
          if [ "$UPSTREAM_SHA" != "$LOCAL_SHA" ]; then
            echo "updates=true" >> $GITHUB_OUTPUT
          else
            echo "updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync fork if updates
        if: steps.check_update.outputs.updates == 'true'
        run: |
          git merge upstream/main -m "Sync fork with upstream"
          git push

      - name: Trigger ERDB Space factory rebuild
        if: steps.check_update.outputs.updates == 'true'
        uses: huggingface/hf-space-action@v2
        with:
          space-id: LucaPora90/erdb-luca
          repo-type: space
          token: ${{ secrets.HF_TOKEN }}
          rebuild: true

      - name: Trigger EasyProxy Space factory rebuild
        if: steps.check_update.outputs.updates == 'true'
        uses: huggingface/hf-space-action@v2
        with:
          space-id: LucaPora90/EasyProxy
          repo-type: space
          token: ${{ secrets.HF_TOKEN }}
          rebuild: true
