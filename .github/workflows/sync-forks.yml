name: Sync Fork & Rebuild Spaces

on:
  schedule:
    - cron: '0 * * * *'  # ogni ora
  workflow_dispatch:      # trigger manuale

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest
    env:
      HF_API_TOKEN: ${{ secrets.HF_TOKEN }}
      FORK_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Sync erdb-luca fork
        id: sync-erdb
        run: |
          git remote add upstream https://github.com/LucaPora90/erdb-luca.git || true
          git fetch upstream
          git checkout main
          UPDATES=$(git log HEAD..upstream/main --oneline)
          if [ -n "$UPDATES" ]; then
            git merge upstream/main
            git push origin main
            echo "ERDB_UPDATED=true" >> $GITHUB_ENV
          fi

      - name: Sync EasyProxy fork
        id: sync-proxy
        run: |
          git remote add upstream https://github.com/LucaPora90/EasyProxy.git || true
          git fetch upstream
          git checkout main
          UPDATES=$(git log HEAD..upstream/main --oneline)
          if [ -n "$UPDATES" ]; then
            git merge upstream/main
            git push origin main
            echo "PROXY_UPDATED=true" >> $GITHUB_ENV
          fi

      - name: Install HF CLI
        run: pip install --upgrade huggingface_hub

      - name: Trigger HF Spaces rebuild (parallel)
        if: env.ERDB_UPDATED == 'true' || env.PROXY_UPDATED == 'true'
        run: |
          echo "Triggering factory rebuilds..."
          (( env.ERDB_UPDATED == 'true' )) && hf space rebuild --name LucaPora90/erdb-luca &
          (( env.PROXY_UPDATED == 'true' )) && hf space rebuild --name LucaPora90/EasyProxy &
          wait
