name: Sync Fork & Ghost Rebuild Spaces

on:
  schedule:
    - cron: '0 * * * *' # ogni ora
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      # Checkout repo principale
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Aggiorna fork erdb-luca
      - name: Sync Fork erdb-luca
        id: sync-erdb
        run: |
          git remote add upstream https://github.com/LucaPora90/erdb-luca.git || true
          git fetch upstream
          git merge upstream/main || echo "No updates"
          git push origin main || echo "Nothing to push"
          echo "updated=true" >> $GITHUB_OUTPUT

      # Aggiorna fork EasyProxy
      - name: Sync Fork EasyProxy
        id: sync-proxy
        run: |
          git clone https://github.com/LucaPora90/EasyProxy.git temp
          cd temp
          git remote add upstream https://github.com/LucaPora90/EasyProxy.git || true
          git fetch upstream
          git merge upstream/main || echo "No updates"
          git push origin main || echo "Nothing to push"
          echo "updated=true" >> $GITHUB_OUTPUT
          cd ..
          rm -rf temp

      # Rebuild ERDB Space (ghost, layer cache)
      - name: Ghost Rebuild ERDB Space
        if: steps.sync-erdb.outputs.updated == 'true'
        uses: huggingface/spaces-action@v0
        with:
          space: 'LucaPora90/erdb-luca'
          token: ${{ secrets.HF_API_TOKEN }}
          rebuild: true
          ghost-mode: true   # layer precompilati, build ~10s

      # Rebuild EasyProxy Space (ghost, layer cache)
      - name: Ghost Rebuild EasyProxy Space
        if: steps.sync-proxy.outputs.updated == 'true'
        uses: huggingface/spaces-action@v0
        with:
          space: 'LucaPora90/EasyProxy'
          token: ${{ secrets.HF_API_TOKEN }}
          rebuild: true
          ghost-mode: true   # layer precompilati, build ~10s
