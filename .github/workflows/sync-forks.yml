name: Sync Fork & Rebuild Spaces

on:
  schedule:
    - cron: '0 * * * *'  # ogni ora
  workflow_dispatch:

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest
    env:
      HF_API_TOKEN: ${{ secrets.HF_TOKEN }}
      FORK_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Python packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Sync erdb-luca fork
        id: sync-erdb
        run: |
          git remote add upstream https://github.com/LucaPora90/erdb-luca.git || true
          git fetch upstream
          git checkout main

          if git diff --quiet HEAD..upstream/main; then
            echo "No updates"
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            git merge upstream/main
            git push origin main
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync EasyProxy fork
        id: sync-proxy
        run: |
          git remote add upstream https://github.com/LucaPora90/EasyProxy.git || true
          git fetch upstream
          git checkout main

          if git diff --quiet HEAD..upstream/main; then
            echo "No updates"
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            git merge upstream/main
            git push origin main
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Install HF CLI
        run: |
          pip install --upgrade huggingface_hub

      - name: Trigger HF Space rebuild in parallel
        run: |
          echo "Checking which Spaces need rebuild..."

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          if [[ "${{ steps.sync-erdb.outputs.updated }}" == "true" ]]; then
            echo "erdb-luca updated -> triggering rebuild via commit"
            git remote add hf-erdb https://user:${HF_API_TOKEN}@huggingface.co/spaces/LucaPora90/erdb-luca || true

            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > build_info_erdb.txt
            git add build_info_erdb.txt
            git commit -m "Trigger rebuild erdb $(date +%s)" || echo "No commit"
            git push hf-erdb main --force &
          fi

          if [[ "${{ steps.sync-proxy.outputs.updated }}" == "true" ]]; then
            echo "EasyProxy updated -> triggering rebuild via commit"
            git remote add hf-proxy https://user:${HF_API_TOKEN}@huggingface.co/spaces/LucaPora90/EasyProxy || true

            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > build_info_proxy.txt
            git add build_info_proxy.txt
            git commit -m "Trigger rebuild proxy $(date +%s)" || echo "No commit"
            git push hf-proxy main --force &
          fi

          wait
          echo "Rebuilds completed"
