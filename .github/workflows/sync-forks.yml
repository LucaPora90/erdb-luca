name: Sync Forks & Factory Rebuild

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout erdb-luca
        uses: actions/checkout@v4
        with:
          repository: LucaPora90/erdb-luca
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull upstream erdb-luca
        run: |
          git remote add upstream https://github.com/realbestia1/erdb.git || true
          git fetch upstream
          git merge upstream/main --allow-unrelated-histories -m "Sync upstream" || true
          git push origin main

      - name: Trigger ERDB Space rebuild
        run: |
          curl -X POST "https://huggingface.co/api/spaces/LucaPora90/erdb-luca/builds" \
            -H "Authorization: Bearer $HF_TOKEN"

      - name: Checkout EasyProxy
        uses: actions/checkout@v4
        with:
          repository: LucaPora90/EasyProxy
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull upstream EasyProxy
        run: |
          git remote add upstream https://github.com/realbestia1/EasyProxy.git || true
          git fetch upstream
          git merge upstream/main --allow-unrelated-histories -m "Sync upstream" || true
          git push origin main

      - name: Trigger EasyProxy Space rebuild
        run: |
          curl -X POST "https://huggingface.co/api/spaces/LucaPora90/EasyProxy/builds" \
            -H "Authorization: Bearer $HF_TOKEN"
